server.port=8000

# H2 Database Config
spring.datasource.url=jdbc:h2:file:./campusos_h2_db;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Config
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.campusos=INFO

# App specific JWT secret
campusos.jwt.secret=9a8f7e6d5c4b3a210f9e8d7c6b5a43210987654321fedcba9876543210123456
campusos.jwt.expiration-ms=86400000
