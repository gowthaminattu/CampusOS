<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 100" fill="none">
  <defs>
    <linearGradient id="primary-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="accent-grad-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="glow-dark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <g transform="translate(10, 10)">
    <!-- Outer Digital 'C' Arc -->
    <path d="M 55,10 A 38,38 0 1,0 55,70" stroke="url(#primary-grad-dark)" stroke-width="7" stroke-linecap="round" fill="none" filter="url(#glow-dark)"/>
    <!-- Building Pillars -->
    <path d="M 30,55 L 30,35 A 10,10 0 0,1 50,35 L 50,55" stroke="#F8FAFC" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 40,30 L 40,55" stroke="url(#accent-grad-dark)" stroke-width="3" stroke-linecap="round"/>
    <!-- Roof Dome / Arch -->
    <path d="M 24,35 L 40,20 L 56,35" stroke="url(#primary-grad-dark)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Connected Network Nodes -->
    <circle cx="55" cy="10" r="5" fill="#38BDF8" />
    <circle cx="55" cy="70" r="5" fill="#818CF8" />
    <circle cx="40" cy="20" r="4" fill="#38BDF8" />
    <circle cx="24" cy="35" r="3.5" fill="#A5B4FC" />
  </g>
  <!-- Typography -->
  <text x="105" y="52" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="800" font-size="36" fill="#F8FAFC" letter-spacing="-0.5">Campus<tspan fill="url(#primary-grad-dark)">OS</tspan></text>
  <text x="106" y="72" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="600" font-size="11" fill="#94A3B8" letter-spacing="1.5">ONE CAMPUS. ONE INTELLIGENT PLATFORM.</text>
</svg>
